name: Publish

# Publishes the gem when a version tag is pushed. RubyGems trusted publishing
# swaps this run's GitHub OIDC token for a short-lived push key, so no API key
# is stored and the gem's rubygems_mfa_required setting does not block CI.
# Needs a trusted publisher on RubyGems.org for paid_ruby: repository
# paid-ai/paid-ruby, workflow publish.yml.
on:
  push:
    tags: ["*"]

permissions:
  contents: read
  id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repo
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

          - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
            with:
              ruby-version: 3.4
              bundler-cache: true

          - name: Test gem
            run: bundle install && bundle exec rake test

          - name: Configure RubyGems credentials
            uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

          - name: Build and Push Gem
            run: |
              gem build paid.gemspec
              gem push paid_ruby-*.gem --host https://rubygems.org/
